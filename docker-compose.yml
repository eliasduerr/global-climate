services:
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set s3 http://storage:9000 minioadmin minioadmin &&
      mc mb --ignore-existing s3/raw &&
      mc mb --ignore-existing s3/interim &&
      mc mb --ignore-existing s3/processed
      "

  ingest:
    depends_on:
      storage-init:
        condition: service_completed_successfully
    build: ./services/ingest
    env_file: ./services/ingest/.env

  clean:
    depends_on:
      ingest:
        condition: service_completed_successfully
    build: ./services/clean
    env_file: ./services/clean/.env

  features:
    depends_on:
      clean:
        condition: service_completed_successfully
    build: ./services/features
    env_file: ./services/features/.env

volumes:
  minio_data: