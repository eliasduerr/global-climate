name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.13"
          prune-cache: false
      - uses: pre-commit/action@v3.0.1

  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [clean, features]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.13"
          prune-cache: false
      - name: Sync dependencies
        working-directory: services/${{ matrix.service }}
        run: uv sync --frozen
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: uv run pytest -v
