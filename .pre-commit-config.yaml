repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.11
    hooks:
      - id: uv-lock
        name: uv-lock (ingest)
        args: ["--project", "services/ingest"]
        files: ^services/ingest/(pyproject\.toml|uv\.lock)$
      - id: uv-lock
        name: uv-lock (clean)
        args: ["--project", "services/clean"]
        files: ^services/clean/(pyproject\.toml|uv\.lock)$
      - id: uv-lock
        name: uv-lock (features)
        args: ["--project", "services/features"]
        files: ^services/features/(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
