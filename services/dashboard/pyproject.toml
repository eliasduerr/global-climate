[project]
name = "dashboard"
version = "0.1.0"
description = "Streamlit dashboard for the global-climate processed layer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=5.5.0",
    "polars>=1.41.0",
    "s3fs>=2024.10.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
